<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <!-- Pico CSS for a clean, modern, responsive look out of the box -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        nav { border-bottom: 1px solid #ddd; margin-bottom: 2rem; padding-bottom: 1rem; }
        footer { margin-top: 3rem; border-top: 1px solid #ddd; padding-top: 1rem; text-align: center; font-size: 0.9em; }
        .hero { text-align: center; padding: 2rem 0; }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong><a href="{{ '/' | relative_url }}" class="contrast">{{ site.title }}</a></strong></li>
            </ul>
            <ul>
                <li><a href="{{ '/' | relative_url }}">Home</a></li>
                <li><a href="{{ '/attorney/' | relative_url }}">Attorney Profile</a></li>
                <li><a href="{{ '/services/' | relative_url }}">Practice Areas</a></li>
                <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
            </ul>
        </nav>

        {{ content }}

        <footer>
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
            <p>181 West Madison, Suite 4700, Chicago, IL 60602 | 847.544.8561</p>
        </footer>
    </main>
</body>
</html>
